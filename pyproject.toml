[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tashevnet"
version = "0.1.0"
description = "Local network flight recorder, VPN watchdog and self-healing connectivity monitor."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Rinat Tashev"}]
keywords = ["network-monitoring", "vpn", "telegram-bot", "uptime", "self-healing"]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]

[project.scripts]
tashevnet = "tashevnet.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001"]

[tool.hatch.build.targets.wheel]
packages = ["src/tashevnet"]
